# Typecheck and tests on every pull request (Dependabot's included), so an update is checked before it's merged.
# Merging to main then deploys through deploy-vps.yml, which runs the same checks again first.
# No secrets and no deploy here: pull requests from forks run with read-only access.
name: ci

on:
  pull_request:
    paths: ['web/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
