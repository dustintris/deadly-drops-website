# Serves the Next.js static export (trailingSlash: true) from /srv/current.
# HTTPS, compression and security headers are handled by Caddy in front.

server {
    listen 80;
    server_name _;
    root /srv/current;
    index index.html;

    # Behind Caddy: keep the /about -> /about/ redirect relative so it does
    # not leak the internal host name or port.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML and RSC payloads: always revalidate so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
