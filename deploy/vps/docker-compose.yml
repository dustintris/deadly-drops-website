# Deadly Drops site on the VPS: Next.js (Node) + PostgreSQL.
#
# Lives at /root/deadly-drops on the server. deploy.sh uploads web/ to ./app and
# the image is built here. The shared Caddy container (/root/FiberTrack/Caddyfile)
# terminates HTTPS for ddptournament.com and proxies to web:80 over the external
# `fibertrack-edge` network via the `ddp-web` alias. No host ports are published;
# the database is reachable only on the project's private `internal` network.
#
# Secrets: ./.env (see .env.example). Uploaded images: ./data. Backups: backup.sh.

name: deadly-drops

# Cap container logs: the host is shared with other sites
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://ddptournament.com}
    image: deadly-drops-web:latest
    restart: unless-stopped
    # Only what the app needs, filled from ./.env (not the whole file: the app never sees POSTGRES_PASSWORD on its own)
    environment:
      DATABASE_URL: postgres://ddp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ddp
      CONTENT_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./data:/data
    # Lets the non-root node user bind port 80 inside the container
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Shared host: keep a runaway process from starving the other sites
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - ddp-web
    logging: *logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddp
      POSTGRES_DB: ddp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker:
    # mount the parent, not .../data as with older images
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # TCP, not the socket: the temporary server during first-boot init listens
      # only on the socket, so this stays "starting" until the real server is up
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ddp", "-d", "ddp"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging: *logging

networks:
  internal:
  proxy:
    external: true
    name: fibertrack-edge

volumes:
  pgdata:
